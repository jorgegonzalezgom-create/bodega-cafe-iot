# ---------- ENTRADA: suscribirse al tema MQTT ----------
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]       # el broker (contenedor vecino)
  username = "telegraf"
  password = "${MQTT_TELEGRAF_PASS}"
  topics = ["bodega1/lecturas"]         # tema donde publica el ESP32
  data_format = "json"                     # el mensaje viene en JSON
  tag_keys = ["dispositivo"]               # "esp32-01" se guarda como etiqueta
  json_string_fields = ["estado"]          # OK / ALERTA como texto
  name_override = "bodega"                 # nombre de la "tabla" en InfluxDB

# ---------- SALIDA 1: InfluxDB en la subred privada ----------
[[outputs.influxdb_v2]]
  urls = ["http://10.0.142.16:8086"]       # IP privada de bd-influxdb
  token = "${INFLUX_TOKEN}"
  organization = "bodega"
  bucket = "lecturas"

# ---------- SALIDA 2: archivo CSV ----------
[[outputs.file]]
  files = ["/data/lecturas.csv"]
  data_format = "csv"
  csv_header = true
